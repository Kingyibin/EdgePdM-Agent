# EdgePdM-Agent default config — paths relative to project root
project:
  name: EdgePdM-Agent
  seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  subset: FD001
  rul_cap: 125

features:
  window_size: 30

models:
  baseline: xgboost
  artifact_dir: models

inference:
  onnx_path: models/rul_baseline.onnx

llm:
  # local llama-server OpenAI-compatible endpoint
  base_url: http://127.0.0.1:8080/v1
  model: local-gguf
